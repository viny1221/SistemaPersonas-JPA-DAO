name: Verificar Java y base integrada
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  portabilidad:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verificar CRUD y persistencia sin MySQL
        run: python tests/verificar_base_integrada.py
      - name: Guardar informe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verificacion-base-integrada-${{ matrix.os }}
          path: target/verificacion-base-integrada.json
          if-no-files-found: ignore
