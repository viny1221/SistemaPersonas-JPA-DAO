name: sistemapersonas
services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Ejecuta el iniciador para generar .env}
      MYSQL_DATABASE: escuela
      MYSQL_USER: personas
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Ejecuta el iniciador para generar .env}
    ports:
      - "127.0.0.1:${MYSQL_PUBLIC_PORT:-3307}:3306"
    volumes:
      - mysql-datos:/var/lib/mysql
      - ./sql/escuela.sql:/docker-entrypoint-initdb.d/01-esquema.sql:ro
      - ./sql/datos-ejemplo.sql:/docker-entrypoint-initdb.d/02-ejemplos.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$${MYSQL_PASSWORD}\" mysql --host=127.0.0.1 --user=\"$${MYSQL_USER}\" --database=\"$${MYSQL_DATABASE}\" --silent --execute='SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped
  app:
    build: .
    environment:
      MYSQL_HOST: db
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: escuela
      MYSQL_USER: personas
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Ejecuta el iniciador para generar .env}
    depends_on:
      db:
        condition: service_healthy
    stdin_open: true
    tty: true
volumes:
  mysql-datos:
